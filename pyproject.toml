[project]
name = "financial-risk-ai-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.5",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "streamlit>=1.67.0",
    "ucimlrepo>=0.0.7",
    "uvicorn>=0.54.0",
]

[project.scripts]
financial-risk-ai-platform = "financial_risk_ai_platform:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
